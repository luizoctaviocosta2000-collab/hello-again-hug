name: Imobfy quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install
      - name: Validate staging financial migration bundle (static check only)
        run: python3 scripts/staging/build_atomic_finance_batch.py --check
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build
      - name: Verify built release identity
        run: |
          python3 - <<'PY'
          import json, os
          with open('.output/public/imobfy-release.json') as f:
              marker = json.load(f)
          assert marker['app'] == 'imobfy'
          assert marker['verification'] == 'build-versioned'
          assert marker['commit_sha'] == os.environ['GITHUB_SHA']
          PY
