name: Explicit commission-side regression

on:
  pull_request:
    branches:
      - main
      - chore/imobfy-engineering-protocol-20261116
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commission-sides:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: imobfy_commission_sides_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: imobfy_commission_sides_test
      PGUSER: postgres
      PGPASSWORD: local-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        run: bun install
      - name: Existing and new Bun tests
        run: bun run test
      - name: TypeScript typecheck
        run: bun run typecheck
      - name: Production build
        run: bun run build
      - name: Reconstruct disposable staging finance base
        run: |
          python3 scripts/staging/build_atomic_finance_batch.py > /tmp/imobfy-finance-stage-10-13.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/database/staging_finance_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f /tmp/imobfy-finance-stage-10-13.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/database/commission_sides_fixture_delta.sql
      - name: Apply historical October finance migration
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610160001_fix_sale_proposal_commission_flow.sql
      - name: Reproduce extra capture commission before fix
        run: psql -X -v ON_ERROR_STOP=1 -f tests/database/commission_sides_prepatch_repro.sql
      - name: Apply explicit-sides correction in isolated PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261116134000_respect_explicit_sale_commission_sides.sql
      - name: Verify venda, captacao, both, meiadas and legacy default
        run: psql -X -v ON_ERROR_STOP=1 -f tests/database/commission_sides_regression.sql
