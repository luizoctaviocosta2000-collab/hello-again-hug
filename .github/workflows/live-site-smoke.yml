name: IMOBFY public site release smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-login-smoke:
    name: Verify public Lovable login availability
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check public login without credentials or customer data
        shell: bash
        run: |
          set -euo pipefail
          # This checks the PUBLISHED endpoint, not GitHub build or Lovable preview.
          url="https://imobfyy.lovable.app/login"
          http_code="$(curl -sS -L --retry 2 --retry-delay 2 --max-time 25 -o /tmp/imobfy-login.html -w '%{http_code}' "$url")"
          echo "Live login returned HTTP $http_code"
          if [[ "$http_code" != "200" ]]; then
            echo "::error::Public Lovable login is not accessible (HTTP $http_code)."
            exit 1
          fi
          if ! grep -Eiq '(IMOBFY|Clareza para o próximo passo)' /tmp/imobfy-login.html; then
            echo "::error::Public page did not include the expected IMOBFY identity."
            exit 1
          fi
          echo "PASS: public IMOBFY login is reachable and carries app identity."
          echo "NOTE: this does NOT prove the newest GitHub commit is published, nor test authenticated journeys."
      - name: Verify exact commit identity served by Lovable
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          for attempt in 1 2 3 4; do
            status="$(curl -sS -L --max-time 25 --output /tmp/imobfy-live-release.json -w '%{http_code}' "https://imobfyy.lovable.app/imobfy-release.json?probe=${GITHUB_SHA}")"
            if [[ "$status" == "200" ]] && python3 - "$expected" <<'PY'
          import json
          import sys
          try:
              with open("/tmp/imobfy-live-release.json", encoding="utf-8") as response:
                  actual = json.load(response)
              assert actual.get("app") == "imobfy"
              assert actual.get("verification") == "build-versioned"
              assert actual.get("commit_sha") == sys.argv[1]
          except (OSError, ValueError, AssertionError):
              sys.exit(1)
          PY
            then
              echo "PASS: live Lovable served expected release marker $expected"
              exit 0
            fi
            echo "Lovable deployment marker not current (attempt $attempt, HTTP $status)"
            sleep 12
          done
          echo "::error::Lovable public deployment is stale or has no matching release marker."
          echo "GitHub build success does not imply Lovable publication. Inspect Lovable build logs and publish."
          exit 1
